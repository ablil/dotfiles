# install dotbot: pip install dotbot
# run it: cd $HOME/.dotfiles && dotbot -c install.conf.yaml

- defaults:
    link:
      relink: true
      create: true  # create parent directory if necessary
      force: true   # force if target link already exists

- clean: ['~']

- create:
  - ~/.ssh/
  - ~/repos
  - ~/.config/gh
  - ~/.config/spring-boot
  - ~/.agents
  - ~/.claude
  - ~/.config/opencode
  - ~/.gradle
  - ~/.git-templates/hooks
  - ~/.vim
  - ~/Library/Application Support/Code/User # macos

- link:
    ~/.vimrc: .vimrc
    ~/.ideavimrc: .ideavimrc
    ~/.vim/keymaps.vim: vim/keymaps.vim
    ~/.curlrc: .curlrc
    ~/.tmux.conf: .tmux.conf

    ~/.zshrc: zsh/.zshrc
    ~/.zprofile: zsh/.zprofile
    ~/.aliases: zsh/.aliases
    ~/.functions: zsh/.functions

    ~/Library/Application Support/Code/User:
      glob: true
      path: Code/*

    ~/.gitconfig: git/.gitconfig
    ~/.gitignore: git/ignore
    ~/.gitattributes: git/attributes
    ~/.ssh/allowed_signers: git/allowed_signers
    ~/.git-templates/policy.sh: git/policy.sh
    ~/.git-templates/hooks:
      glob: true
      path: git/hooks/*

    ~/.gradle/gradle.properties: gradle/gradle.properties
    ~/.gradle/init.d/init.gradle.kts: gradle/init.gradle.kts

    ~/.config/spring-boot/spring-boot-devtools.yaml: ./spring-boot-devtools.yaml

    ~/.config/opencode/AGENTS.md: .agents/AGENTS.md
    ~/.config/opencode/cli.json: .agents/opencode/cli.json
    ~/.config/opencode/themes: .agents/opencode/themes
    ~/.claude/CLAUDE.md: .agents/AGENTS.md

    ~/.agents/skills/git-commit: .agents/skills/git-commit
    ~/.agents/skills/spring-boot-project-scaffold: .agents/skills/spring-boot-project-scaffold
