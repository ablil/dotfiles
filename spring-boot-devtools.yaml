spring:
  docker:
    lifecycle-management: start_only
  devtools:
    livereload:
      enabled: false
  main:
    banner-mode: off
    lazy-initialization: true
  output:
    ansi:
      enabled: always
  jackson:
    serialization:
      indent_output: true # pretty-print JSON

server:
  error:
    include-message: always


logging:
  include-application-name: false
  pattern:
    dateformat: 'HH:mm:ss.SSS'

management:
  endpoints:
    web:
      exposure:
        include: '*'
