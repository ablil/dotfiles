# Local build cache: reuses task outputs across builds and branches.
org.gradle.caching=true

# Reuses the configuration phase between builds. "warn" keeps builds green when a
# plugin is incompatible, but it can still store a cache entry — fix the warnings.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Daemon heap: 1g could not survive parallel Kotlin/Spring builds. This file beats a
# project's gradle.properties, and the heap dump lands in the daemon's start directory.
org.gradle.jvmargs=-Xms512m -Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# Only applies when a build falls back from the configuration cache; with it enabled,
# parallel execution is automatic and cannot be disabled.
org.gradle.parallel=true

# Kotlin compiles in its own JVM, so it does not share the daemon heap above.
kotlin.daemon.jvmargs=-Xmx2g

# IntelliJ's official Kotlin style for generated code, in every project.
kotlin.code.style=official

# Daemons are the default; drop one after an hour idle (default is three) instead of
# holding its 3g heap all afternoon.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000
